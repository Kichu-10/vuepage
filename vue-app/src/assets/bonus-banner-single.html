<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonus Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ BANNER CSS (copy from here) ============ */
/* Everything is sized in cqw (1% of banner width), so it scales perfectly on any screen. */
.bonus-banner {
  container-type: inline-size;
  position: relative;
  width: 100%;
  max-width: 1240px;
  aspect-ratio: 1240 / 548;
  margin: 0 auto;
  border-radius: 2.3cqw;
  overflow: hidden;
  color: #fff;
  font-family: "Poppins", "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #28a352 0%, #12853a 36%, #0b6c2c 47%, #065822 60%, #014a1d 77%, #04451b 100%);
}
.bonus-banner > * { position: absolute; }

/* dotted texture */
.bonus-banner::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.08) 1.2px, transparent 1.4px);
  background-size: 1.1cqw 1.1cqw;
}

/* ARTWORK (girl + cash + gifts): replace banner-art.png with your own */
.bonus-banner__art {
  left: 52.8cqw; top: 0.65cqw;
  width: 46.05cqw; height: 42.9cqw;
  object-fit: contain; object-position: right bottom;
  pointer-events: none;
}

/* Title */
.bonus-banner__line { left: 11.7cqw; margin: 0; white-space: nowrap; font-weight: 700; line-height: 1; }
.bonus-banner__l1 { top: 5.2cqw;  font-size: 4.9cqw; }
.bonus-banner__l1 b { font-size: 9.1cqw; font-weight: 800; margin-left: .3cqw; vertical-align: -0.35cqw; }
.bonus-banner__l2 { top: 14.4cqw; font-size: 3.65cqw; font-weight: 600; }
.bonus-banner__l3 { top: 19.3cqw; font-size: 3.44cqw; font-weight: 600; }

/* Amount pill */
.bonus-banner__pill {
  left: 12.1cqw; top: 25.4cqw; width: 36.3cqw; height: 7.4cqw;
  border-radius: 10cqw; background: rgba(0,0,0,.17);
}
.bonus-banner__upto { left: 14.9cqw; top: 26.1cqw; font-size: 2cqw; font-weight: 600; color: #6fc990; line-height: 1; }
.bonus-banner__rs   { left: 14.9cqw; top: 27.9cqw; font-size: 4.8cqw; font-weight: 800; line-height: 1; }
.bonus-banner__num  {
  left: 24.4cqw; top: 25.7cqw; font-size: 6.7cqw; font-weight: 800; line-height: 1.1; white-space: nowrap;
  background: linear-gradient(#fff2b0 0%, #f5c93a 55%, #d79a0c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* Claim button */
.bonus-banner__btn {
  left: 11.9cqw; top: 35.5cqw; width: 26.2cqw; height: 6.5cqw;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.4cqw 0 3cqw; box-sizing: border-box;
  border-radius: 10cqw; text-decoration: none; color: #fff;
  font-size: 2.8cqw; font-weight: 500;
  background: linear-gradient(#6fdb5f 0%, #34a43f 100%);
  box-shadow: 0 .5cqw 1.2cqw rgba(0,0,0,.3), inset 0 0 0 .2cqw rgba(255,255,255,.25);
  transition: transform .15s ease, filter .15s ease;
}
.bonus-banner__btn i {
  width: 3.5cqw; height: 3.5cqw; border-radius: 50%; background: #fff;
  display: grid; place-items: center; color: #2a9a3b; font-style: normal; font-weight: 800; font-size: 3.2cqw; line-height: 1; padding-bottom: .3cqw; box-sizing: border-box;
}
.bonus-banner__btn:hover { transform: translateY(-.2cqw); filter: brightness(1.08); }
.bonus-banner__btn:focus-visible { outline: .3cqw solid #fff; outline-offset: .3cqw; }

/* Logo badge (image cropped from your banner) */
.bonus-banner__logo { left: .56cqw; top: 20.8cqw; width: 10.4cqw; height: auto; }

/* Slider dots */
.bonus-banner__dots { left: 45.4cqw; top: 40.2cqw; display: flex; gap: 1cqw; }
.bonus-banner__dots span { width: 1.9cqw; height: 1.9cqw; border-radius: 50%; background: rgba(255,255,255,.4); }
.bonus-banner__dots span:first-child { background: #fff; }
/* ============ END BANNER CSS ============ */

body { margin: 0; padding: 24px; background: #eef1f0; }
</style>
</head>
