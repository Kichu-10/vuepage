name: CI

on:
  push:
    paths:
      - "vue-app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "vue-app/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vue-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
